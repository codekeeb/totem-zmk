# Shared config: applies to BOTH halves.

# Keyboard name as it appears over Bluetooth.
CONFIG_ZMK_KEYBOARD_NAME="TOTEM"

# Sleep after 30 min idle to save battery. The halves wake on a keypress.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# ZMK Studio is NOT enabled here: this file applies to both halves, and
# only the left one exposes the RPC. It is turned on for totem_left in
# build.yaml (cmake-args: -DCONFIG_ZMK_STUDIO=y), which is where it
# belongs -- CONFIG_ZMK_STUDIO does "select PM_DEVICE", so enabling it
# here would change power management on a half that never uses it.
